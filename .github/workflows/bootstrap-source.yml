name: Import NOVA source archive

on:
  push:
    branches: [main]
    paths:
      - 'nova-ai-source.tar.gz'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract application source
        run: |
          mkdir -p /tmp/nova-ai-source
          tar -xzf nova-ai-source.tar.gz -C /tmp/nova-ai-source
          cp -a /tmp/nova-ai-source/. .
          rm -f nova-ai-source.tar.gz
      - name: Commit normal source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to import.'
            exit 0
          fi
          git commit -m 'feat: import NOVA AI application source tree'
          git push
