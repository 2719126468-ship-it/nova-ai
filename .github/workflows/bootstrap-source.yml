name: Import NOVA source archive

on:
  push:
    branches: [main]
    paths:
      - '.nova-ai-upload/part-*'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract application source
        run: |
          mkdir -p /tmp/nova-ai-source
          cat .nova-ai-upload/part-0[0-3] | base64 --decode > /tmp/nova-ai-source.tar.gz
          tar -xzf /tmp/nova-ai-source.tar.gz -C /tmp/nova-ai-source
          cp -a /tmp/nova-ai-source/. .
          rm -rf .nova-ai-upload
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run API tests
        run: npm test
      - name: Build web client
        run: npm run build
      - name: Commit normal source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to import.'
            exit 0
          fi
          git commit -m 'feat: import NOVA AI application source tree'
          git push
