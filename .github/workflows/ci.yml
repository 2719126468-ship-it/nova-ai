name: NOVA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API tests
        run: npm test
      - name: Build web client
        run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: npm ci
      - name: Build web client
        run: npm run build
      - name: Browser smoke test
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run e2e
